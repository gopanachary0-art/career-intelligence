services:
  db:
    image: pgvector/pgvector:pg16
    container_name: fitcraft-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fitcraft
      POSTGRES_PASSWORD: fitcraft
      POSTGRES_DB: fitcraft
    ports:
      - "5432:5432"
    volumes:
      - fitcraft_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitcraft -d fitcraft"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fitcraft_pgdata:
